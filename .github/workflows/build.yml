name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (secrets)
        env:
          VT_KEYSTORE_B64: ${{ secrets.VT_KEYSTORE_B64 }}
        run: |
          if [ -n "$VT_KEYSTORE_B64" ]; then
            echo "$VT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/voicetyper.jks"
            echo "VT_KEYSTORE=$RUNNER_TEMP/voicetyper.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret VT_KEYSTORE_B64 missing: APK signed with a random debug key, no release published."
          fi
      - name: Tests (logique de texte)
        run: ./gradlew :core:test --console=plain
      - name: APK
        env:
          VT_KEYSTORE_PASSWORD: ${{ secrets.VT_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: voice-typer-mobile-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - name: Release (one per versionName, on main)
        # only with the fixed key: an APK signed with a random key cannot update the installed app
        if: github.event_name == 'push' && env.VT_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V already exists: bump versionName in app/build.gradle.kts to publish a new one."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "VoiceTyperMobile-$V.apk"
          gh release create "$V" "VoiceTyperMobile-$V.apk" --target "$GITHUB_SHA" --title "Voice Typer Mobile $V" --generate-notes
